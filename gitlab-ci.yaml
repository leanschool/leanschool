stages:
  - build
  - publish
  - deploy

variables:
  REGISTRY: $CI_REGISTRY
  IMAGE_PREFIX: $CI_REGISTRY_IMAGE

# ── Build ──────────────────────────────────────────────────────────────────────

.docker-build:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  before_script:
    - docker info
  script:
    - docker build
        --file $DOCKERFILE
        --tag $IMAGE_NAME:$CI_COMMIT_SHA
        --tag $IMAGE_NAME:latest
        --cache-from $IMAGE_NAME:latest
        $BUILD_CONTEXT
    - docker save $IMAGE_NAME:$CI_COMMIT_SHA | gzip > image.tar.gz
  artifacts:
    paths:
      - image.tar.gz
    expire_in: 1 hour

build:leanschool:
  extends: .docker-build
  variables:
    DOCKERFILE: infra/dockerfiles/Dockerfile.leanschool
    BUILD_CONTEXT: .
    IMAGE_NAME: $IMAGE_PREFIX/leanschool

build:file-service:
  extends: .docker-build
  variables:
    DOCKERFILE: infra/dockerfiles/Dockerfile.file-service
    BUILD_CONTEXT: .
    IMAGE_NAME: $IMAGE_PREFIX/file-service

build:receipt-reader:
  extends: .docker-build
  variables:
    DOCKERFILE: infra/dockerfiles/Dockerfile.receipt-reader
    BUILD_CONTEXT: .
    IMAGE_NAME: $IMAGE_PREFIX/receipt-reader

build:timetable-service:
  extends: .docker-build
  variables:
    DOCKERFILE: infra/dockerfiles/Dockerfile.timetable-service
    BUILD_CONTEXT: .
    IMAGE_NAME: $IMAGE_PREFIX/timetable-service

build:ui:
  extends: .docker-build
  variables:
    DOCKERFILE: infra/dockerfiles/Dockerfile.ui
    BUILD_CONTEXT: leanschool-ui
    IMAGE_NAME: $IMAGE_PREFIX/ui

# ── Publish ────────────────────────────────────────────────────────────────────

.docker-publish:
  stage: publish
  image: docker:27
  services:
    - docker:27-dind
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker load < image.tar.gz
  script:
    - docker push $IMAGE_NAME:$CI_COMMIT_SHA
    - docker push $IMAGE_NAME:latest

publish:leanschool:
  extends: .docker-publish
  needs: [build:leanschool]
  variables:
    IMAGE_NAME: $IMAGE_PREFIX/leanschool

publish:file-service:
  extends: .docker-publish
  needs: [build:file-service]
  variables:
    IMAGE_NAME: $IMAGE_PREFIX/file-service

publish:receipt-reader:
  extends: .docker-publish
  needs: [build:receipt-reader]
  variables:
    IMAGE_NAME: $IMAGE_PREFIX/receipt-reader

publish:timetable-service:
  extends: .docker-publish
  needs: [build:timetable-service]
  variables:
    IMAGE_NAME: $IMAGE_PREFIX/timetable-service

publish:ui:
  extends: .docker-publish
  needs: [build:ui]
  variables:
    IMAGE_NAME: $IMAGE_PREFIX/ui

# ── Deploy ─────────────────────────────────────────────────────────────────────

deploy:
  stage: deploy
  script:
    - echo "Deploy stage — not yet implemented"
  when: manual
