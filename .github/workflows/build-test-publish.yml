name: Build, Test, and Publish

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  IMAGE_VERSION: ${{ github.ref_name }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.26'

    - name: Build leanschool
      run: cd leanschool && go build -o ../bin/leanschool ./cmd/...

    - name: Build receipt-reader
      run: cd receipt-reader && go build -o ../bin/receipt-reader ./cmd/...

    - name: Test leanschool
      run: cd leanschool && go test ./...

    - name: Test receipt-reader
      run: cd receipt-reader && go test ./...

  build-and-push-images:
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Log in to the Container registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata (tags, labels) for Docker
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

    - name: Build and push leanschool image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./infra/dockerfiles/Dockerfile.leanschool
        push: true
        tags: |
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-leanschool:${{ env.IMAGE_VERSION }}
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-leanschool:latest
        labels: ${{ steps.meta.outputs.labels }}

    - name: Build and push receipt-reader image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./infra/dockerfiles/Dockerfile.receipt-reader
        push: true
        tags: |
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-receipt-reader:${{ env.IMAGE_VERSION }}
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-receipt-reader:latest
        labels: ${{ steps.meta.outputs.labels }}

    - name: Build and push UI image
      uses: docker/build-push-action@v5
      with:
        context: ./leanschool-ui
        file: ./infra/dockerfiles/Dockerfile.ui
        push: true
        tags: |
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-ui:${{ env.IMAGE_VERSION }}
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-ui:latest
        labels: ${{ steps.meta.outputs.labels }}
